name: CI

on:
  push:
  pull_request:

jobs:
  syntax-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Core smoke test
        run: npm run smoke
