name: CI
on:
  push:
    branches: [main, build/batto-obs-tool-2.1-core]
  pull_request:
  workflow_dispatch:
    inputs:
      run_four_hour_soak:
        description: Run 4 hour soak test
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: batto-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Core smoke test
        run: npm run smoke
      - name: UI contract
        run: npm run test:ui
      - name: Settings and secrets storage regression
        run: npm run test:storage
      - name: Installer license and key regression
        run: npm run test:installer
      - name: Core 2.1 acceptance
        run: npm run test:core
      - name: 500 events per second for 60 seconds
        env:
          STRESS_SECONDS: 60
          STRESS_RATE: 500
        run: npm run stress
      - name: Quick soak regression
        run: npm run soak:quick
      - uses: actions/upload-artifact@v4
        with:
          name: Batto-OBS-Tool-QA-Source
          path: |
            electron/
            src/
            scripts/
            build/installer.nsh
            build/installer-key-verifier.json
            build/license_de.txt
            package.json
            package-lock.json
            README.md
          if-no-files-found: error
  windows-installer:
    needs: core-acceptance
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Windows core, secrets and HTTP runtime
        run: npm run check && npm run smoke && npm run test:storage && npm run test:core && npm run test:runtime && npm run test:installer
      - name: Build and test isolated QA key gate, then rebuild production installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $random = New-Object byte[] 14
          [Security.Cryptography.RandomNumberGenerator]::Fill($random)
          $qaKey = -join ($random | ForEach-Object { ($_ % 10).ToString() })
          $lastDigit = [int]::Parse($qaKey.Substring(13, 1))
          $wrongKey = $qaKey.Substring(0, 13) + (($lastDigit + 1) % 10).ToString()
          $qaInstallerPattern = 'dist-qa\Batto-OBS-Tool-2.1-Setup-*.exe'

          try {
            $env:BATTO_INSTALL_KEY_OVERRIDE = $qaKey
            npm run pack:win -- --config.directories.output=dist-qa
            if ($LASTEXITCODE -ne 0) { throw 'QA installer build failed.' }
            Remove-Item Env:BATTO_INSTALL_KEY_OVERRIDE -ErrorAction SilentlyContinue

            $qaInstallers = @(Get-ChildItem $qaInstallerPattern)
            if ($qaInstallers.Count -ne 1) { throw "Expected exactly one QA installer, found $($qaInstallers.Count)." }
            $installer = $qaInstallers[0]
            $env:BATTO_KEY_LEAK_SCAN = $qaKey
            node scripts/assert-key-absent.cjs $installer.FullName build/generated-installer-key.nsh
            if ($LASTEXITCODE -ne 0) { throw 'QA installer plaintext scan failed.' }
            Remove-Item Env:BATTO_KEY_LEAK_SCAN -ErrorAction SilentlyContinue

            $env:BATTO_INSTALL_KEY = $qaKey
            Remove-Item Env:BATTO_ACCEPT_LICENSE -ErrorAction SilentlyContinue
            $noConsentDir = Join-Path $env:RUNNER_TEMP 'batto-reject-no-consent'
            $noConsent = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$noConsentDir") -PassThru -Wait
            if ($noConsent.ExitCode -eq 0 -or (Test-Path (Join-Path $noConsentDir 'Batto OBS Tool 2.1.exe'))) {
              throw 'Silent installation without explicit license consent was not rejected.'
            }

            $env:BATTO_ACCEPT_LICENSE = 'YES'
            Remove-Item Env:BATTO_INSTALL_KEY -ErrorAction SilentlyContinue
            $noKeyDir = Join-Path $env:RUNNER_TEMP 'batto-reject-no-key'
            $noKey = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$noKeyDir") -PassThru -Wait
            if ($noKey.ExitCode -eq 0 -or (Test-Path (Join-Path $noKeyDir 'Batto OBS Tool 2.1.exe'))) {
              throw 'Silent installation without key was not rejected.'
            }

            $env:BATTO_INSTALL_KEY = $wrongKey
            $wrongKeyDir = Join-Path $env:RUNNER_TEMP 'batto-reject-wrong-key'
            $wrong = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$wrongKeyDir") -PassThru -Wait
            if ($wrong.ExitCode -eq 0 -or (Test-Path (Join-Path $wrongKeyDir 'Batto OBS Tool 2.1.exe'))) {
              throw 'Silent installation with wrong key was not rejected.'
            }

            $env:BATTO_INSTALL_KEY = $qaKey
            $installDir = Join-Path $env:RUNNER_TEMP 'batto-installed'
            $accepted = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
            if ($accepted.ExitCode -ne 0) { throw "Installer failed with isolated QA key: $($accepted.ExitCode)" }
            if (-not (Test-Path (Join-Path $installDir 'Batto OBS Tool 2.1.exe'))) {
              throw 'Installed executable is missing after accepted QA key.'
            }
          }
          finally {
            Remove-Item Env:BATTO_INSTALL_KEY_OVERRIDE -ErrorAction SilentlyContinue
            Remove-Item Env:BATTO_INSTALL_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:BATTO_ACCEPT_LICENSE -ErrorAction SilentlyContinue
            Remove-Item Env:BATTO_KEY_LEAK_SCAN -ErrorAction SilentlyContinue
          }

          npm run pack:win
          if ($LASTEXITCODE -ne 0) { throw 'Production installer rebuild failed.' }
          $productionInstallers = @(Get-ChildItem 'dist\Batto-OBS-Tool-2.1-Setup-*.exe')
          if ($productionInstallers.Count -ne 1) { throw "Expected exactly one production installer, found $($productionInstallers.Count)." }
          $productionInstaller = $productionInstallers[0]
          $env:BATTO_KEY_LEAK_SCAN = $qaKey
          node scripts/assert-key-absent.cjs $productionInstaller.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Production installer plaintext scan failed.' }
          Remove-Item Env:BATTO_KEY_LEAK_SCAN -ErrorAction SilentlyContinue
          $qaKey = $null
          $wrongKey = $null
          [Array]::Clear($random, 0, $random.Length)
      - name: Test packaged app independently of the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:BATTO_QA_DIR = Join-Path $env:RUNNER_TEMP 'batto-packaged-qa'
          $exe = Join-Path (Get-Location) 'dist\win-unpacked\Batto OBS Tool 2.1.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--batto-qa' -WorkingDirectory (Split-Path $exe) -PassThru
          if (-not $process.WaitForExit(150000)) { Stop-Process -Id $process.Id -Force; throw 'Packaged app QA timed out' }
          $report = Join-Path $env:BATTO_QA_DIR 'result.json'
          if (-not (Test-Path $report)) { throw 'Packaged app produced no QA report' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          $result.checks | ForEach-Object { Write-Host "PASS: $_" }
          if (-not $result.ok -or $process.ExitCode -ne 0) { throw "Packaged app QA failed: $($result.error)" }
      - name: Test installed real Electron UI and IPC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'batto-installed'
          $exe = Join-Path $installDir 'Batto OBS Tool 2.1.exe'
          if (-not (Test-Path $exe)) { throw "Installed executable missing: $exe" }
          $env:BATTO_QA_DIR = Join-Path $env:RUNNER_TEMP 'batto-qa-report'
          $process = Start-Process -FilePath $exe -ArgumentList '--batto-qa' -PassThru
          if (-not $process.WaitForExit(150000)) { Stop-Process -Id $process.Id -Force; throw 'Installed app QA timed out' }
          $report = Join-Path $env:BATTO_QA_DIR 'result.json'
          if (-not (Test-Path $report)) { throw 'Installed app produced no QA report' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          $result.checks | ForEach-Object { Write-Host "PASS: $_" }
          if (-not $result.ok -or $process.ExitCode -ne 0) { throw "Installed app QA failed: $($result.error)" }
          $restartProcess = Start-Process -FilePath $exe -ArgumentList '--batto-qa-resume' -PassThru
          if (-not $restartProcess.WaitForExit(60000)) { Stop-Process -Id $restartProcess.Id -Force; throw 'Installed app restart QA timed out' }
          $restartReport = Join-Path $env:BATTO_QA_DIR 'resume-result.json'
          if (-not (Test-Path $restartReport)) { throw 'Installed app restart produced no QA report' }
          $restartResult = Get-Content $restartReport -Raw | ConvertFrom-Json
          $restartResult.checks | ForEach-Object { Write-Host "PASS AFTER RESTART: $_" }
          if (-not $restartResult.ok -or $restartProcess.ExitCode -ne 0) { throw "Installed app restart QA failed: $($restartResult.error)" }
      - name: Upload installed-app QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Batto-Windows-QA-Evidence
          path: |
            ${{ runner.temp }}/batto-qa-report/result.json
            ${{ runner.temp }}/batto-qa-report/resume-result.json
            ${{ runner.temp }}/batto-qa-report/*.png
            ${{ runner.temp }}/batto-packaged-qa/result.json
            ${{ runner.temp }}/batto-packaged-qa/*.png
          if-no-files-found: warn
      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Batto-OBS-Tool-2.1-Windows-${{ github.event_name == 'pull_request' && 'PR-QA' || (github.event_name == 'push' && 'Release' || 'Manual-QA') }}
          path: dist/Batto-OBS-Tool-2.1-Setup-*.exe
          if-no-files-found: error
  soak-4h:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_four_hour_soak }}
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Four hour soak acceptance
        env:
          SOAK_MINUTES: 240
        run: npm run soak
