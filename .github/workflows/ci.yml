name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_four_hour_soak:
        description: 'Run 4 hour soak test'
        required: false
        default: false
        type: boolean

jobs:
  core-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Core smoke test
        run: npm run smoke
      - name: UI contract
        run: npm run test:ui
      - name: Core 2.1 acceptance
        run: npm run test:core
      - name: 500 events per second for 60 seconds
        env:
          STRESS_SECONDS: 60
          STRESS_RATE: 500
        run: npm run stress
      - name: Quick soak regression
        env:
          SOAK_MINUTES: 1
        run: node scripts/soak.cjs
      - name: Upload QA source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Batto-OBS-Tool-2.1-QA-Source
          path: |
            electron/
            src/
            scripts/
            package.json
            README.md
          if-no-files-found: error

  windows-installer:
    needs: core-acceptance
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and core verification on Windows
        run: npm run check && npm run smoke && npm run test:core
      - name: Build Windows installer
        run: npm run pack:win
      - name: Install and launch smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'dist\Batto-OBS-Tool-2.1-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found.' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $searchRoots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "$env:ProgramFiles(x86)") | Where-Object { $_ -and (Test-Path $_) }
          $exe = $null
          foreach ($root in $searchRoots) {
            $exe = Get-ChildItem $root -Recurse -Filter 'Batto OBS Tool 2.1.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { break }
          }
          if (-not $exe) { throw 'Installed Batto OBS Tool 2.1 executable not found.' }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 12
          $process.Refresh()
          if ($process.HasExited) { throw "Batto OBS Tool exited during startup smoke test with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Installed and launched successfully: $($exe.FullName)"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Batto-OBS-Tool-2.1-Windows
          path: dist/*.exe
          if-no-files-found: error

  soak-4h:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_four_hour_soak }}
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Four hour soak acceptance
        env:
          SOAK_MINUTES: 240
        run: npm run soak
