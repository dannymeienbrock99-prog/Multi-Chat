# CRAZY_BATTO 2.1.2 delivery trigger 2026-09-10
name: Marmor Gold Delivery

on:
  push:
    branches: [build/batto-obs-tool-2.1-core]
    paths: [.github/workflows/marmor-gold-delivery.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marmor-gold-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepared.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate already prepared application changes without overwriting newer edits
        id: prepared
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const cp = require('child_process');
            const repo = context.repo;
            const root = process.cwd();
            const preparedSha = 'df3e852c2ec963d9e90afcb56cc27825615b0c22';
            const baselineSha = 'c0234a296d3d100cad270122a59bb5ff49569bfd';
            const tree = async sha => {
              const {data} = await github.rest.git.getTree({...repo, tree_sha: sha, recursive: '1'});
              if (data.truncated) throw new Error('Git tree is incomplete; stopping instead of guessing.');
              return new Map(data.tree.filter(e => e.type === 'blob').map(e => [e.path, e]));
            };
            const prepared = await tree(preparedSha);
            const baseline = await tree(baselineSha);
            const current = await tree(context.sha);
            const changes = [];
            for (const [name, item] of prepared) {
              if (item.sha === baseline.get(name)?.sha || item.sha === current.get(name)?.sha) continue;
              if (item.mode !== '100644') throw new Error(`Unsupported prepared file mode: ${name}`);
              if (!(name.startsWith('src/') || name.startsWith('electron/') || name.startsWith('scripts/') || name.startsWith('test/') || name.startsWith('tests/') || name.startsWith('build/') || ['package.json','package-lock.json','README.md'].includes(name))) continue;
              if (name.startsWith('src/assets/') && current.has(name) && !baseline.has(name)) continue;
              if (current.get(name)?.sha !== baseline.get(name)?.sha) throw new Error(`Newer changes exist in ${name}; manual reconciliation required.`);
              const dest = path.resolve(root, name);
              if (!dest.startsWith(root + path.sep)) throw new Error('Unsafe repository path');
              const {data: blob} = await github.rest.git.getBlob({...repo, file_sha: item.sha});
              if (blob.encoding !== 'base64') throw new Error(`Unexpected blob encoding: ${name}`);
              const bytes = Buffer.from(blob.content.replace(/\s/g, ''), 'base64');
              const digest = crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
              if (digest !== item.sha) throw new Error(`Integrity mismatch: ${name}`);
              fs.mkdirSync(path.dirname(dest), {recursive: true});
              fs.writeFileSync(dest, bytes);
              changes.push(name);
            }
            if (changes.length) {
              cp.execFileSync('git', ['add', '--', ...changes]);
              cp.execFileSync('git', ['-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Integrate prepared Start, Marmor/Gold and independent broadcast controls']);
              cp.execFileSync('git', ['push','origin',`HEAD:${context.ref.replace('refs/heads/','')}`]);
            }
            const commit = cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            core.setOutput('commit', commit);
            core.info(`Prepared files integrated: ${changes.length}; commit ${commit}`);
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Core, settings, runtime and UI contract tests
        run: |
          npm run check
          npm run smoke
          npm run test:storage
          npm run test:core
          npm run test:runtime
          npm run test:ui
      - name: Run prepared broadcast and branding regression tests
        run: |
          node - <<'JS'
          const cp = require('child_process');
          const scripts = require('./package.json').scripts || {};
          for (const name of Object.keys(scripts)) {
            if (/^test:/.test(name) && /broadcast|gold|branding|schedule/.test(name)) cp.execFileSync('npm',['run',name],{stdio:'inherit'});
          }
          JS
      - name: Event load regression
        env:
          STRESS_SECONDS: 60
          STRESS_RATE: 500
        run: npm run stress
      - name: Short soak regression
        env:
          SOAK_MINUTES: 1
        run: node scripts/soak.cjs

  windows-delivery:
    needs: prepare-and-test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-and-test.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Windows verification
        run: npm run check && npm run smoke && npm run test:storage && npm run test:core && npm run test:runtime && npm run test:ui
      - name: Build Windows installer with existing NSIS and asset fixes
        run: npm run pack:win
      - name: Install and run existing application acceptance checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'dist\Batto-OBS-Tool-2.1-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          $installDir = Join-Path $env:RUNNER_TEMP 'batto-gold-installed'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $exe = Join-Path $installDir ($package.build.productName + '.exe')
          if (-not (Test-Path $exe)) { throw 'Installed executable is missing' }
          $env:BATTO_QA_DIR = Join-Path $env:RUNNER_TEMP 'batto-gold-qa'
          $process = Start-Process -FilePath $exe -ArgumentList '--batto-qa' -PassThru
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id -Force; throw 'Installed application acceptance timed out' }
          $report = Join-Path $env:BATTO_QA_DIR 'result.json'
          if (-not (Test-Path $report)) { throw 'Application produced no acceptance report' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or $process.ExitCode -ne 0) { throw "Application acceptance failed: $($result.error)" }
          "BATTO_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BATTO_QA_DIR=$env:BATTO_QA_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install test-only Electron browser driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --package-lock=false playwright --no-audit --no-fund
      - name: Exercise actual Start, Broadcast, Settings and detached windows
        shell: pwsh
        run: |
          @'
          const { _electron: electron } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const assert = require('assert/strict');
          (async () => {
            const out = process.env.BATTO_QA_DIR;
            fs.mkdirSync(out, {recursive:true});
            const checks = [];
            const errors = [];
            let app;
            try {
              const profile = path.join(process.env.RUNNER_TEMP,'batto-gold-rendered-profile');
              fs.mkdirSync(profile, {recursive:true});
              app = await electron.launch({executablePath:process.env.BATTO_INSTALLED_EXE, env:{...process.env,APPDATA:profile}, timeout:90000});
              const page = await app.firstWindow({timeout:90000});
              page.on('pageerror', e => errors.push(e.message));
              await page.waitForFunction(() => window.batto && document.querySelector('#mainNav'), {timeout:60000});
              await page.evaluate(() => window.batto.getState());
              const nav = await page.locator('#mainNav [data-view]').evaluateAll(items => items.map(el=>el.getAttribute('data-view')));
              assert(nav.includes('start'), 'Start navigation is missing');
              assert(nav.indexOf('start') < nav.indexOf('dashboard'), 'Start must precede Multi-Chat');
              checks.push('Start button is above Multi-Chat');
              for (const view of ['start','dashboard','broadcast','settings']) {
                await page.locator(`#mainNav [data-view="${view}"]`).click();
                await page.waitForTimeout(350);
                assert(await page.locator(`[data-view-panel="${view}"]`).isVisible(), `${view} did not open`);
                assert((await page.locator('body').innerText()).trim().length > 100, 'Blank application');
                const broken = await page.locator('img:visible').evaluateAll(imgs=>imgs.filter(i=>!i.complete || i.naturalWidth===0).map(i=>i.getAttribute('src')));
                assert.deepEqual(broken, [], `Missing image in ${view}`);
                await page.screenshot({path:path.join(out, `${view}.png`), fullPage:false});
                checks.push(`${view}: real rendered window, controls and images loaded`);
              }
              const persisted = await page.evaluate(async () => {
                await window.batto.saveConfig({tts:{volume:0.37}});
                return (await window.batto.getState()).config.tts.volume;
              });
              assert.equal(persisted,0.37,'TTS setting did not persist through IPC');
              checks.push('TTS setting applies and reads back through real IPC');
              await page.evaluate(()=>window.batto.detachChat());
              const deadline = Date.now()+15000;
              while(app.windows().length<2 && Date.now()<deadline) await page.waitForTimeout(100);
              const detached = app.windows().find(w=>w!==page);
              assert(detached, 'Detached chat did not open');
              await detached.waitForFunction(()=>window.batto && document.querySelector('#chatList'));
              await detached.waitForTimeout(500);
              await detached.screenshot({path:path.join(out,'detached.png'),fullPage:false});
              checks.push('Detached chat window opens');
              assert.deepEqual(errors, [], 'Renderer runtime error');
              fs.writeFileSync(path.join(out,'rendered-checks.json'),JSON.stringify({ok:true,checks,errors},null,2));
            } catch (error) {
              fs.writeFileSync(path.join(out,'rendered-checks.json'),JSON.stringify({ok:false,checks,errors,error:error.stack},null,2));
              throw error;
            } finally { if(app) await app.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          '@ | Set-Content scripts/gold-delivery-visual-test.cjs -Encoding utf8
          node scripts/gold-delivery-visual-test.cjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Marmor-Gold-Actual-Windows-QA
          path: ${{ runner.temp }}/batto-gold-qa/
          if-no-files-found: warn
      - name: Package verified delivery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'dist\Batto-OBS-Tool-2.1-Setup-*.exe' | Select-Object -First 1
          Copy-Item $installer.FullName 'dist\Batto-MarmorGold-Windows-Setup.exe'
          Compress-Archive -Path 'dist\Batto-MarmorGold-Windows-Setup.exe' -DestinationPath 'dist\Batto-MarmorGold-Windows.zip' -Force
          $hash = (Get-FileHash 'dist\Batto-MarmorGold-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  Batto-MarmorGold-Windows-Setup.exe" | Set-Content 'dist\SHA256SUMS.txt' -Encoding ascii
          Compress-Archive -Path "$env:BATTO_QA_DIR\*" -DestinationPath 'dist\Batto-MarmorGold-QA.zip' -Force
      - name: Upload verified Windows program
        uses: actions/upload-artifact@v4
        with:
          name: Batto-MarmorGold-Windows-Verified
          path: |
            dist/Batto-MarmorGold-Windows-Setup.exe
            dist/Batto-MarmorGold-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tested development build without merging main
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_COMMIT: ${{ needs.prepare-and-test.outputs.commit }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'marmor-gold-20260910'
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Delivery release already exists; refusing to overwrite it.' }
          gh release create $tag 'dist/Batto-MarmorGold-Windows-Setup.exe' 'dist/Batto-MarmorGold-Windows.zip' 'dist/Batto-MarmorGold-QA.zip' 'dist/SHA256SUMS.txt' --target $env:DELIVERY_COMMIT --prerelease --title 'Batto OBS Tool - Marmor/Gold Windows' --notes 'Windows installer with original artwork, Start view and prepared broadcast changes. Installation, packaged application, storage/runtime tests and real-window screenshots were checked by this delivery run. This is a development build: live platform-account acceptance, real OBS-device acceptance and the full four-hour soak are not certified by this release. Main remains unchanged.'
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
